<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Exame de IMC</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle at top, #042f3a 0%, #000000 55%);
      font-family: "Rajdhani", Arial, sans-serif; padding: 20px; color: #f8fafc;
    }
    .folha {
      width: 100%; max-width: 520px; background: rgba(5, 8, 12, 0.95); padding: 30px;
      border-radius: 18px; border: 1px solid #22d3ee;
      box-shadow: 0 0 30px #22d3ee, inset 0 0 25px rgba(34, 211, 238, 0.08);
    }
    h1 {
      margin: 0; text-align: center; font-family: "Orbitron", sans-serif; font-size: 28px;
      letter-spacing: 2px; color: #67e8f9; text-shadow: 0 0 8px #22d3ee, 0 0 22px #06b6d4;
      animation: brilho 2.4s ease-in-out infinite;
    }
    @keyframes brilho {
      0%, 100% { text-shadow: 0 0 8px #22d3ee, 0 0 18px #06b6d4; }
      50% { text-shadow: 0 0 16px #67e8f9, 0 0 36px #22d3ee; }
    }
    .subtitulo {
      margin: 8px 0 6px; text-align: center; color: #a5f3fc; font-size: 18px;
      letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px #22d3ee;
    }
    .linha-luz {
      height: 2px; margin: 12px auto 16px; width: 70%;
      background: linear-gradient(90deg, transparent, #22d3ee, #67e8f9, #22d3ee, transparent);
      box-shadow: 0 0 12px #22d3ee;
    }
    .formula {
      text-align: center; margin: 0 0 16px; padding: 10px; border-radius: 10px; color: #ecfeff;
      background: #021016; border: 1px solid #22d3ee; box-shadow: 0 0 14px rgba(34, 211, 238, 0.45);
      text-shadow: 0 0 8px #22d3ee; font-size: 18px;
    }
    .foto-area { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    #preview {
      width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
      border: 2px solid #22d3ee; box-shadow: 0 0 16px #22d3ee; background: #001018;
    }
    .foto-area label { margin-top: 0; }
    .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label {
      display: block; margin-top: 12px; margin-bottom: 6px; font-weight: 700;
      color: #67e8f9; text-shadow: 0 0 8px #22d3ee;
    }
    input, select {
      width: 100%; padding: 10px; border: 1px solid #22d3ee; border-radius: 8px; font-size: 16px;
      font-family: inherit; background: #000000; color: #ffffff; outline: none;
      box-shadow: 0 0 8px rgba(34, 211, 238, 0.35);
    }
    select option { background: #000000; color: #ffffff; }
    input:focus, select:focus { box-shadow: 0 0 16px #22d3ee; }
    .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    button {
      width: 100%; padding: 13px; border: 0; border-radius: 10px; font-size: 15px;
      font-weight: 700; font-family: "Orbitron", sans-serif; letter-spacing: 1px; cursor: pointer;
    }
    .btn-gerar { background: linear-gradient(90deg, #06b6d4, #67e8f9); color: #001018; box-shadow: 0 0 22px #22d3ee; }
    .btn-limpar { background: #000000; color: #67e8f9; border: 1px solid #22d3ee; box-shadow: 0 0 14px rgba(34, 211, 238, 0.4); }
    #resultado-folha {
      display: none; margin-top: 16px; padding: 14px; border: 1px solid #22d3ee;
      border-radius: 10px; box-shadow: 0 0 18px rgba(34, 211, 238, 0.45);
    }
    #resultado-folha p { margin: 6px 0; color: #e2e8f0; }
    #imc-final { margin-top: 10px; text-align: center; font-size: 20px; font-weight: 700; font-family: "Orbitron", sans-serif; }
    h2 {
      margin: 22px 0 12px; text-align: center; color: #67e8f9; font-family: "Orbitron", sans-serif;
      font-size: 16px; letter-spacing: 2px; text-shadow: 0 0 10px #22d3ee;
    }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #164e63; }
    th { background: #083344; color: #67e8f9; text-shadow: 0 0 8px #22d3ee; }
    .c1 { color: #60a5fa; text-shadow: 0 0 8px #3b82f6; }
    .c2 { color: #4ade80; text-shadow: 0 0 8px #22c55e; }
    .c3 { color: #facc15; text-shadow: 0 0 8px #eab308; }
    .c4 { color: #fb923c; text-shadow: 0 0 8px #f97316; }
    .c5 { color: #f87171; text-shadow: 0 0 8px #ef4444; }
    .c6 { color: #f472b6; text-shadow: 0 0 8px #ec4899; }
    @media (max-width: 500px) { .linha, .botoes { grid-template-columns: 1fr; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <div class="folha">
    <h1>EXAME DE IMC</h1>
    <p class="subtitulo">Saúde em destaque</p>
    <div class="linha-luz"></div>
    <p class="formula">IMC = peso ÷ (altura × altura)</p>

    <div class="foto-area">
      <img id="preview" alt="Foto do paciente" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><rect width='84' height='84' fill='%23001018'/><circle cx='42' cy='32' r='14' fill='%2322d3ee'/><ellipse cx='42' cy='68' rx='22' ry='16' fill='%2322d3ee'/></svg>">
      <div>
        <label for="foto">Foto do paciente</label>
        <input type="file" id="foto" accept="image/*">
      </div>
    </div>

    <label for="nome">Nome do paciente</label>
    <input type="text" id="nome" placeholder="Nome completo">

    <div class="linha">
      <div>
        <label for="idade">Idade</label>
        <input type="number" id="idade" min="1" max="120" placeholder="Anos">
      </div>
      <div>
        <label for="sexo">Sexo</label>
        <select id="sexo">
          <option value="">Escolha</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
        </select>
      </div>
    </div>

    <div class="linha">
      <div>
        <label for="data">Data do exame</label>
        <input type="date" id="data">
      </div>
      <div>
        <label for="profissional">Profissional</label>
        <input type="text" id="profissional" placeholder="Nome do médico">
      </div>
    </div>

    <div class="linha">
      <div>
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" min="1">
      </div>
      <div>
        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01" min="0.5" placeholder="Ex.: 1.70">
      </div>
    </div>

    <div class="botoes">
      <button class="btn-gerar" onclick="calcularIMC()">GERAR RESULTADO</button>
      <button class="btn-limpar" type="button" onclick="limparFicha()">NOVO EXAME</button>
    </div>

    <div id="resultado-folha">
      <p id="r-nome"></p>
      <p id="r-idade"></p>
      <p id="r-sexo"></p>
      <p id="r-data"></p>
      <p id="r-profissional"></p>
      <p id="r-peso"></p>
      <p id="r-altura"></p>
      <p id="imc-final"></p>
    </div>

    <h2>CLASSIFICAÇÃO</h2>
    <table>
      <tr><th>IMC</th><th>Resultado</th></tr>
      <tr><td>Menor que 18,5</td><td class="c1">Abaixo do peso</td></tr>
      <tr><td>18,5 a 24,9</td><td class="c2">Peso normal</td></tr>
      <tr><td>25,0 a 29,9</td><td class="c3">Sobrepeso</td></tr>
      <tr><td>30,0 a 34,9</td><td class="c4">Obesidade grau I</td></tr>
      <tr><td>35,0 a 39,9</td><td class="c5">Obesidade grau II</td></tr>
      <tr><td>40,0 ou mais</td><td class="c6">Obesidade grau III</td></tr>
    </table>
  </div>

  <script>
    const fotoPadrao = document.getElementById("preview").src;
    function hoje() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, "0");
      const dia = String(agora.getDate()).padStart(2, "0");
      return ano + "-" + mes + "-" + dia;
    }
    document.getElementById("data").value = hoje();
    document.getElementById("foto").addEventListener("change", function () {
      const arquivo = this.files[0];
      if (!arquivo) return;
      const leitor = new FileReader();
      leitor.onload = function (evento) {
        document.getElementById("preview").src = evento.target.result;
      };
      leitor.readAsDataURL(arquivo);
    });
    function formatarData(valor) {
      if (!valor) return "Não informada";
      const partes = valor.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }
    function calcularIMC() {
      const nome = document.getElementById("nome").value.trim();
      const idade = document.getElementById("idade").value;
      const sexo = document.getElementById("sexo").value;
      const data = document.getElementById("data").value;
      const profissional = document.getElementById("profissional").value.trim();
      const peso = parseFloat(document.getElementById("peso").value);
      const altura = parseFloat(document.getElementById("altura").value);
      const caixa = document.getElementById("resultado-folha");
      const final = document.getElementById("imc-final");
      caixa.style.display = "block";
      if (!peso || !altura || peso <= 0 || altura <= 0) {
        document.getElementById("r-nome").innerText = "";
        document.getElementById("r-idade").innerText = "";
        document.getElementById("r-sexo").innerText = "";
        document.getElementById("r-data").innerText = "";
        document.getElementById("r-profissional").innerText = "";
        document.getElementById("r-peso").innerText = "";
        document.getElementById("r-altura").innerText = "";
        final.style.color = "#f87171";
        final.innerText = "Digite o peso e a altura.";
        return;
      }
      const imc = peso / (altura * altura);
      let classificacao = "";
      let cor = "#67e8f9";
      if (imc < 18.5) { classificacao = "Abaixo do peso"; cor = "#60a5fa"; }
      else if (imc < 25) { classificacao = "Peso normal"; cor = "#4ade80"; }
      else if (imc < 30) { classificacao = "Sobrepeso"; cor = "#facc15"; }
      else if (imc < 35) { classificacao = "Obesidade grau I"; cor = "#fb923c"; }
      else if (imc < 40) { classificacao = "Obesidade grau II"; cor = "#f87171"; }
      else { classificacao = "Obesidade grau III"; cor = "#f472b6"; }
      document.getElementById("r-nome").innerText = "Paciente: " + (nome || "Não informado");
      document.getElementById("r-idade").innerText = "Idade: " + (idade ? idade + " anos" : "Não informada");
      document.getElementById("r-sexo").innerText = "Sexo: " + (sexo || "Não informado");
      document.getElementById("r-data").innerText = "Data do exame: " + formatarData(data);
      document.getElementById("r-profissional").innerText = "Profissional: " + (profissional || "Não informado");
      document.getElementById("r-peso").innerText = "Peso: " + peso.toFixed(1) + " kg";
      document.getElementById("r-altura").innerText = "Altura: " + altura.toFixed(2) + " m";
      final.style.color = cor;
      final.style.textShadow = "0 0 12px " + cor;
      final.innerText = "RESULTADO: " + imc.toFixed(2) + " • " + classificacao;
    }
    function limparFicha() {
      document.getElementById("nome").value = "";
      document.getElementById("idade").value = "";
      document.getElementById("sexo").value = "";
      document.getElementById("profissional").value = "";
      document.getElementById("peso").value = "";
      document.getElementById("altura").value = "";
      document.getElementById("foto").value = "";
      document.getElementById("preview").src = fotoPadrao;
      document.getElementById("data").value = hoje();
      document.getElementById("resultado-folha").style.display = "none";
    }
  </script>
</body>
</html>
